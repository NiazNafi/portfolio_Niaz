# Every route is a prerendered file, so there are deliberately NO redirects here.
# Do not add `/* -> /index.html`: it would serve the home page's markup under
# every URL. See docs/DEPLOY.md.

[build]
  command = "npm run build"
  publish = "client/dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The site loads nothing from anywhere else — fonts, images and scripts are all
# same-origin — so the policy can be restrictive rather than a list of exceptions.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
